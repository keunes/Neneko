# Add this service to your existing docker-compose.yml.
services:
  neneko:
    image: ghcr.io/keunes/neneko:latest     # latest-dev for pre-releases too; or build it: build: .
    restart: unless-stopped
    ports:
      - "8089:8089"               # the Kobo connects here over your LAN
    volumes:
      - neneko-data:/data         # database and built articles
    environment:
      TZ: Europe/Berlin           # your time zone, for the times in the log
      NENEKO_NC_URL: https://cloud.example.org
      NENEKO_NC_USER: your-nextcloud-login
      NENEKO_NC_APP_PASSWORD_FILE: /run/secrets/neneko_nc_app_password
      NENEKO_KOBO_TOKEN_FILE: /run/secrets/neneko_kobo_token
      NENEKO_PUBLIC_URL: http://neneko-host:8089    # how the Kobo reaches this container
      # Which feeds (default: all). Start from the included folders (or everything), remove
      # excluded folders, add included feeds, remove excluded feeds. See README "Which feeds".
      # NENEKO_INCLUDE_FOLDERS: "Tech,News"
      # NENEKO_EXCLUDE_FOLDERS: "Sport"
      # NENEKO_INCLUDE_FEEDS: "Ars Technica"        # feed titles or IDs
      # NENEKO_EXCLUDE_FEEDS: "BBC News,CNN"
      # NENEKO_MAX_ITEMS: "50"
      # NENEKO_MARK_READ_ON: opened                 # opened | finished | delivered
      # NENEKO_COLLECTIONS: "all,folder"            # add ",feed" for one collection per feed
      # NENEKO_COLLECTION_ALL_NAME: "Neneko"
      # NENEKO_FULLTEXT_NEVER_EXTRACT: "Some Feed With Full Text"
    secrets:
      - neneko_nc_app_password
      - neneko_kobo_token

volumes:
  neneko-data:

secrets:
  neneko_nc_app_password:
    file: ./secrets/neneko_nc_app_password
  neneko_kobo_token:
    file: ./secrets/neneko_kobo_token
