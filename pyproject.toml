[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neneko"
version = "0.1.0"
description = "Sync Nextcloud News articles to a Kobo e-reader by emulating the Kobo store sync API"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.7",
    "ebooklib>=0.18",
    "nh3>=0.2.17",
    "lxml>=5.2",
    "lxml_html_clean>=0.2",
    "pillow>=10.4",
    "numpy>=1.26",
    "trafilatura>=1.12",
    "readability-lxml>=0.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
neneko = "neneko.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neneko.kobo" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
